[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplychain-jepa"
version = "0.1.0"
description = "A predictive world model for partially observed supply-chain systems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "SupplyChain-JEPA contributors" }]
keywords = ["jepa", "world-model", "supply-chain", "time-series", "operations-research"]
dependencies = [
  "huggingface-hub>=0.34,<2",
  "numpy>=1.26,<3",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
train = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
]
adapters = [
  "jsonpickle>=3,<5",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyyaml>=6,<7",
  "scipy>=1.13,<2",
  "simpy>=4.1,<5",
  "tabulate>=0.9,<1",
  "tqdm>=4.66,<5",
]
eval = [
  "joblib>=1.4,<2",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "xgboost>=2.1,<4",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]
all = [
  "jsonpickle>=3,<5",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "openpyxl>=3.1,<4",
  "simpy>=4.1,<5",
  "tabulate>=0.9,<1",
  "tqdm>=4.66,<5",
  "joblib>=1.4,<2",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "xgboost>=2.1,<4",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supplychain_jepa = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "private_model: requires access to the private pretrained model release",
  "external_data: requires separately acquired downstream data",
  "slow: bounded end-to-end or training test",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["supplychain_jepa", "evaluations"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
