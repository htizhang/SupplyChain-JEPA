<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-labelledby="title desc">
  <title id="title">One product-store example, as every method sees it</title>
  <desc id="desc">Illustrative schematic of a controlled-stockout demand-recovery example. Left: daily sales totals from in-stock hours for the previous 28 days; three days are marked censored because the product was out of stock for some hours. Right: the target day's 16 operating hours from 06:00 to 22:00. Twelve hours are visible. Four afternoon hours, 15:00 to 19:00, are masked in the shape of a real stockout, and each method estimates their total demand. The label is the actual sales in those hours, because the product was in stock all day. Values are illustrative.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A37"/>
      <stop offset="1" stop-color="#16384A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4659"/>
      <stop offset="1" stop-color="#183D4E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F8F95"/>
      <stop offset="1" stop-color="#7FD8C8"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#3A3A2A" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#F2B04B" stroke-width="2.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9FC3CF"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .heading { font-size: 21px; font-weight: 600; fill: #FFFFFF; }
      .step { font-size: 12.5px; font-weight: 700; fill: #7FD8C8; letter-spacing: 1.2px; }
      .title { font-size: 17px; font-weight: 600; fill: #FFFFFF; }
      .label { font-size: 13px; fill: #D5E6EC; }
      .small { font-size: 12px; fill: #A9C8D3; }
      .tiny { font-size: 11px; fill: #A9C8D3; }
      .strong { font-size: 13.5px; font-weight: 600; fill: #FFFFFF; }
      .q { font-size: 15px; font-weight: 700; fill: #EE6F86; }
      .hidden { font-size: 12.5px; font-weight: 600; fill: #EE6F86; }
    </style>
  </defs>

