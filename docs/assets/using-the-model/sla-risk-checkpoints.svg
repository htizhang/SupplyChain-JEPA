  <text x="52" y="307" class="label" text-anchor="start">Outgoing leg</text>
  <text x="52" y="323" class="tiny" text-anchor="start">never revealed before the join</text>
  <rect x="214" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="292" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="370" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="448" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="526" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="604" y="292" width="66" height="34" rx="6" fill="none" stroke="#5E8D9C" stroke-width="1.3" stroke-dasharray="3 3"/>
