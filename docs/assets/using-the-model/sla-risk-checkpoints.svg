  <text x="52" y="96" class="step" text-anchor="start">1  MILESTONES</text>
  <text x="52" y="120" class="title" text-anchor="start">What has been reported</text>
  <text x="52" y="140" class="small" text-anchor="start">Planned durations are known for every cell; actual ones appear when reported</text>
