<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="1000" height="428" role="img" aria-labelledby="title desc">
  <title id="title">One shipment at two reporting checkpoints</title>
  <desc id="desc">Illustrative schematic of the delayed-reporting protocol for one Cargo2000 shipment. Rows are an ordinary incoming leg, the critical incoming leg with the longest planned duration, and the outgoing leg. Columns are the milestones check-in (RCS), departure and arrival of the first and second flight segments (DEP and RCF), and delivery (DLV). Dashed vertical lines mark the in_rcs checkpoint after check-in and the in_seg1 decision checkpoint after the first segment. The ordinary leg has reported its check-in and first segment. The critical leg's check-in and first-segment reports are withheld as delayed. Later milestones and the outgoing leg are not yet reported. On the right, the frozen encoder's state at in_rcs is subtracted from its state at in_seg1, and the transition is scored against a late-minus-on-time direction that supplies 20 percent of the review priority.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A37"/>
      <stop offset="1" stop-color="#16384A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4659"/>
      <stop offset="1" stop-color="#183D4E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F8F95"/>
      <stop offset="1" stop-color="#7FD8C8"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#3A3A2A" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#F2B04B" stroke-width="2.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9FC3CF"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .heading { font-size: 21px; font-weight: 600; fill: #FFFFFF; }
      .step { font-size: 12.5px; font-weight: 700; fill: #7FD8C8; letter-spacing: 1.2px; }
      .title { font-size: 17px; font-weight: 600; fill: #FFFFFF; }
      .label { font-size: 13px; fill: #D5E6EC; }
      .small { font-size: 12px; fill: #A9C8D3; }
      .tiny { font-size: 11px; fill: #A9C8D3; }
      .strong { font-size: 13.5px; font-weight: 600; fill: #FFFFFF; }
      .q { font-size: 15px; font-weight: 700; fill: #EE6F86; }
      .hidden { font-size: 12.5px; font-weight: 600; fill: #EE6F86; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="428" rx="18" fill="url(#bg)"/>
