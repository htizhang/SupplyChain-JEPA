<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="1000" height="428" role="img" aria-labelledby="title desc">
  <title id="title">Two plans, evaluated on the same futures</title>
  <desc id="desc">Illustrative schematic of one replenishment decision world. Left: 16 periods of public history in three rows. The global record of inventory, backlog, demand, sales, and pipeline is reported every period; the primary and secondary supplier rows contain delayed capacity reports. A fourth row stands for the suppliers' reliability regimes, which are never observed. Right: from the decision point, a regular plan that orders the full quantity from the primary supplier and a split plan that divides the same quantity between both suppliers each run for four periods on the same simulated futures. Their average costs are 33.4 and 31.0 units, so choosing split has zero regret and choosing regular has regret 2.4. Values are illustrative.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A37"/>
      <stop offset="1" stop-color="#16384A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4659"/>
      <stop offset="1" stop-color="#183D4E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F8F95"/>
      <stop offset="1" stop-color="#7FD8C8"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#3A3A2A" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#F2B04B" stroke-width="2.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9FC3CF"/>
    </marker>
    <style>
