<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Example 1: the hidden present</title>
<desc id="desc">A two-warehouse grid over days 1 to 10. The context runs through day 8. Warehouse East's records for days 7 and 8 are hidden and graded, while Warehouse West's records and the orders on days 4 and 7 stay visible. A dashed outline marks the target view: the actual records of both warehouses on days 7 and 8. Days 9 and 10 are outside the question.</desc>
<defs>
  <pattern id="hatch-amber" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)">
    <rect width="9" height="9" fill="#fef3c7"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#f59e0b" stroke-width="3" opacity="0.30"/>
  </pattern>
  <pattern id="hatch-grey" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#f1f5f9"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2" opacity="0.35"/>
  </pattern>
</defs>
<rect x="1.0" y="1.0" width="958.0" height="402.0" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
