<text x="134.0" y="42.0" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">The hidden present</text>
<text x="28.0" y="74.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">What is East's condition on days 7 and 8? Only East's own reports are removed; the rest of day 7 and day 8 stays visible.</text>
